name: OWASP Dependency Check

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Cache Dependency-Check Data
        uses: actions/cache@v5
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-${{ runner.os }}-v1
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=7 \
            -DretireJsAnalyzerEnabled=true \
            -Dformat=HTML \
            -DdataDirectory=$HOME/.m2/dependency-check-data \
            -DfailOnUpdateError=false \
            -DnvdApiKey="${NVD_API_KEY}"

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn