name: "OWASP Dependency Check"
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Fix mvnw permissions
        run: chmod +x ./mvnw

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: nvd-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-cache-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DretireJsAnalyzerEnabled=true \
            -Dformat=HTML \
            -DoutputDirectory=reports \
            -DdataDirectory=$HOME/.m2/dependency-check-data \
            -DfailOnUpdateError=false \
            -DnvdApiKey="${NVD_API_KEY}"

      - name: Upload report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dependency-check-report
          path: reports/