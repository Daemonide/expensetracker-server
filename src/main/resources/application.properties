spring.application.name=expensetracker
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# HikariCP
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.jackson.mapper.accept-case-insensitive-enums=true
# JWT
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Turnstile
turnstile.secret=${TURNSTILE_SECRET_KEY}
# Actuator
management.server.port=9090
management.server.address=localhost
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=never